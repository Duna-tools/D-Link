name: Build & Release

on:
  push:
    branches: [ main ]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-release:
    name: Build & Pack (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            dist_prefix: d-link-linux-x86_64
          - os: windows-latest
            dist_prefix: d-link-windows-x64
          - os: macos-latest
            dist_prefix: d-link-macos-intel
          - os: macos-14
            dist_prefix: d-link-macos-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # --- Dependencies ---
      - name: Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libusb-1.0-0-dev pkg-config ruby ruby-dev rubygems build-essential rpm
          sudo gem install --no-document fpm

      - name: Dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install libusb pkg-config

      - name: Dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install libusb:x64-windows-static-md
          echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV

      # --- Test & Build Atómico ---
      - name: Run Tests
        if: runner.os != 'Windows'
        run: cargo test --locked
        env:
          LIBUSB_ALLOW_VENDORED: 0

      - name: Build Release
        run: cargo build --release --locked
        env:
          LIBUSB_ALLOW_VENDORED: ${{ runner.os == 'Windows' && '1' || '0' }}

      # --- Packaging ---
      - name: Pack Linux
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          mkdir -p staging/usr/bin
          cp target/release/d-link staging/usr/bin/
          fpm -s dir -t deb -n d-link -v ${{ github.ref_name }} -C staging .
          fpm -s dir -t rpm -n d-link -v ${{ github.ref_name }} -C staging .
          mv *.deb *.rpm dist/
          cp target/release/d-link dist/${{ matrix.dist_prefix }}

      - name: Pack Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist
          Compress-Archive -Path target\release\d-link.exe -DestinationPath dist\${{ matrix.dist_prefix }}.zip
          Copy-Item target\release\d-link.exe dist\${{ matrix.dist_prefix }}.exe

      - name: Pack macOS
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          cp target/release/d-link dist/${{ matrix.dist_prefix }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.dist_prefix }}
          path: dist/*

  release:
    name: Create GitHub Release
    needs: build-and-release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Generate Checksums
        shell: bash
        run: |
          cd dist
          sha256sum * > SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: D-Link Release ${{ github.ref_name }}
          files: |
            dist/*
          body: |
            ## D-Link Release ${{ github.ref_name }}

            ### Assets produced by CI:
            - **Linux**: Debian/Ubuntu (.deb) and Fedora/RPM (.rpm).
            - **Windows**: Portable (.zip) and standalone .exe.
            - **macOS**: Native binaries for Intel and Apple Silicon (ARM64).

            ### Integrity Verification
            ```bash
            sha256sum -c SHA256SUMS
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
