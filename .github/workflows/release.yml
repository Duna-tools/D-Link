name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build & Pack ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            target: x86_64-unknown-linux-gnu
            pack_deb: true
            pack_rpm: true
          
          - os: windows-latest
            arch: x86_64
            target: x86_64-pc-windows-msvc

          - os: macos-latest
            arch: x86_64
            target: x86_64-apple-darwin

          - os: macos-latest
            arch: aarch64
            target: aarch64-apple-darwin

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # --- DEPENDENCIAS DE SISTEMA (Solo Unix) ---
      - name: Install Dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libusb-1.0-0-dev pkg-config ruby ruby-dev rubygems build-essential rpm
          sudo gem install --no-document fpm

      - name: Install Dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install libusb pkg-config

      # --- COMPILACIÓN ---
      - name: Build Release
        run: cargo build --release --target ${{ matrix.target }}

      # --- EMPAQUETADO ---
      - name: Pack Linux (.deb & .rpm)
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p staging/usr/bin
          cp target/${{ matrix.target }}/release/d-link staging/usr/bin/
          fpm -s dir -t deb -n d-link -v ${{ github.ref_name }} -C staging .
          fpm -s dir -t rpm -n d-link -v ${{ github.ref_name }} -C staging .

      - name: Pack Windows (Zip)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/d-link.exe -DestinationPath d-link-windows-x64.zip

      - name: Generate Checksums
        shell: bash
        run: |
          if [ "${{ matrix.os }}" == "ubuntu-latest" ]; then
            sha256sum *.deb *.rpm > checksums.txt
          elif [ "${{ matrix.os }}" == "windows-latest" ]; then
            sha256sum *.zip > checksums.txt
          else
            cd target/${{ matrix.target }}/release
            sha256sum d-link > ../../../checksums-${{ matrix.arch }}.txt
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            *.deb
            *.rpm
            *.zip
            checksums*.txt
            target/${{ matrix.target }}/release/d-link

  create-release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Consolidate Checksums
        run: |
          cat artifacts-*/checksums*.txt > SHA256SUMS.txt
          sort -u SHA256SUMS.txt -o SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            **/ *.deb
            **/ *.rpm
            **/ *.zip
            **/ d-link
            SHA256SUMS.txt
          body: |
            ## D-Link Release
            
            ### Integrity Verification
            Download `SHA256SUMS.txt` to verify your files:
            ```bash
            sha256sum -c SHA256SUMS.txt
            ```
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
