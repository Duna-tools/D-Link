[package]
name = "d-link"
version = "0.1.0"
description = "High-performance TI-Nspire terminal management system"
authors = ["Lucas Boniche"]
edition = "2021"

[dependencies]
# Ratatui ecosystem
ratatui = "0.28.1"
crossterm = "0.28.1"
tui-textarea = "0.6.0"

# USB & System
libnspire = "0.2"
dirs = "5.0"
lazy_static = "1.4"
hashbrown = "0.14"

[target.'cfg(windows)'.dependencies]
rusb = { version = "0.6", features = ["vendored"] }

[target.'cfg(not(windows))'.dependencies]
rusb = "0.6"


# Async & Utilities
tokio = { version = "1.36", features = ["full"] }
anyhow = "1.0"
thiserror = "2.0"
chrono = "0.4"
crossbeam-channel = "0.5"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

# Logging
log = "0.4"
image = { version = "0.25.9", features = ["png"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
